<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0F1720">
<title>RAN Estoque</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
  :root{
    --bg:#0F1720;
    --panel:#16212C;
    --panel-2:#1C2A37;
    --ink:#E7EDF2;
    --ink-soft:#8FA3B5;
    --line:#25333F;
    --accent:#E8A33D;      /* estoque */
    --accent-2:#5B8DEF;    /* linha */
    --ok:#3FB27F;
    --danger:#E2574C;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  header{
    padding:14px 16px 10px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .wordmark{font-size:13px;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase;}
  .setor-label{font-size:17px;font-weight:700;margin-top:2px;}
  .mode-toggle{display:flex;gap:8px;margin-top:12px;}
  .mode-btn{
    flex:1;padding:12px 0;border-radius:10px;border:2px solid var(--line);
    background:var(--panel);color:var(--ink-soft);font-size:15px;font-weight:700;
  }
  .mode-btn.active-estoque{border-color:var(--accent);color:var(--accent);background:rgba(232,163,61,0.12);}
  .mode-btn.active-linha{border-color:var(--accent-2);color:var(--accent-2);background:rgba(91,141,239,0.12);}

  main{flex:1;overflow-y:auto;padding:18px 16px 90px;}
  .tab{display:none;}
  .tab.active{display:block;}

  /* --- BIPAR --- */
  .scan-step{font-size:14px;color:var(--ink-soft);text-align:center;margin-bottom:6px;letter-spacing:.02em;}
  .scan-preview{
    text-align:center;font-size:20px;font-weight:700;min-height:28px;margin-bottom:14px;color:var(--ink-soft);
  }
  .scan-preview b{color:var(--ink);}
  .scan-input{
    width:100%;font-size:30px;text-align:center;letter-spacing:.06em;
    padding:20px 10px;border-radius:14px;border:2px solid var(--line);
    background:var(--panel);color:var(--ink);text-transform:uppercase;
    font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  .scan-input.mode-estoque{border-color:var(--accent);}
  .scan-input.mode-linha{border-color:var(--accent-2);}
  .scan-input:focus{outline:none;}
  .btn{
    width:100%;padding:16px 0;margin-top:12px;border:none;border-radius:12px;
    font-size:16px;font-weight:700;background:var(--panel-2);color:var(--ink);
  }
  .btn.primary{background:var(--ok);color:#04241a;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-soft);}
  .btn.danger{background:var(--danger);color:#2b0705;}
  .last-saved{margin-top:18px;text-align:center;font-size:13px;color:var(--ink-soft);}

  .flash-overlay{
    position:fixed;inset:0;background:var(--ok);opacity:0;pointer-events:none;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
    color:#04241a;font-size:22px;font-weight:800;transition:opacity .18s ease;z-index:50;
  }
  .flash-overlay.show{opacity:.92;}

  /* --- CONSULTAR --- */
  .search-input{
    width:100%;padding:14px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);font-size:16px;margin-bottom:14px;
  }
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);}
  th{color:var(--ink-soft);font-size:12px;text-transform:uppercase;letter-spacing:.04em;}
  td.mono{font-family:ui-monospace,Menlo,Consolas,monospace;}
  .badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge.estoque{background:rgba(232,163,61,0.15);color:var(--accent);}
  .badge.linha{background:rgba(91,141,239,0.15);color:var(--accent-2);}
  .empty-state{text-align:center;color:var(--ink-soft);padding:40px 10px;font-size:14px;}

  /* --- EXPORTAR / CONFIG --- */
  .stat-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;}
  .stat-card .n{font-size:26px;font-weight:800;font-family:ui-monospace,Menlo,Consolas,monospace;}
  .stat-card .l{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  label{display:block;font-size:13px;color:var(--ink-soft);margin:14px 0 6px;}
  input[type=text].field{
    width:100%;padding:13px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);font-size:16px;
  }
  hr{border:none;border-top:1px solid var(--line);margin:22px 0;}

  nav{
    position:fixed;left:0;right:0;bottom:0;display:flex;
    background:var(--panel);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .nav-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    background:none;border:none;color:var(--ink-soft);font-size:11px;padding:6px 0;
  }
  .nav-btn svg{width:22px;height:22px;}
  .nav-btn.active{color:var(--accent);}
</style>
</head>
<body>

<header>
  <div class="wordmark">RAN Estoque</div>
  <div class="setor-label" id="setorLabel">Setor não definido</div>
  <div class="mode-toggle">
    <button class="mode-btn active-estoque" id="modeEstoqueBtn">Estoque</button>
    <button class="mode-btn" id="modeLinhaBtn">Linha</button>
  </div>
</header>

<main>
  <section class="tab active" id="tab-bipar">
    <div class="scan-step" id="scanStepLabel">Bipe a peça (RAN)</div>
    <div class="scan-preview" id="scanPreview"></div>
    <input type="text" id="scanInput" class="scan-input mode-estoque" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="—">
    <button class="btn primary" id="confirmBtn">Confirmar</button>
    <button class="btn ghost" id="cancelBtn" style="display:none;">Cancelar peça</button>
    <div class="last-saved" id="lastSaved"></div>
  </section>

  <section class="tab" id="tab-consultar">
    <input type="text" class="search-input" id="searchInput" placeholder="Buscar por RAN ou endereço">
    <div id="consultaWrap"></div>
  </section>

  <section class="tab" id="tab-exportar">
    <div class="stat-card"><div class="n" id="statEstoque">0</div><div class="l">peças em estoque (posição atual)</div></div>
    <div class="stat-card"><div class="n" id="statLinha">0</div><div class="l">movimentações pendentes de sincronizar (linha)</div></div>
    <button class="btn primary" id="btnExpEstoque">Baixar CSV — peças em estoque (atual)</button>
    <button class="btn" id="btnExpLinha">Baixar CSV — foi pra linha (pendente)</button>
    <button class="btn ghost" id="btnExpHistorico">Baixar CSV — histórico completo</button>
  </section>

  <section class="tab" id="tab-config">
    <label>Nome do setor</label>
    <input type="text" class="field" id="cfgSetor" placeholder="Ex: Recebimento A">
    <label>Operador (opcional)</label>
    <input type="text" class="field" id="cfgOperador" placeholder="Seu nome">
    <button class="btn primary" id="btnSalvarCfg">Salvar</button>
    <hr>
    <div class="stat-card"><div class="n" id="statTotal">0</div><div class="l">registros salvos neste dispositivo</div></div>
    <button class="btn danger" id="btnLimpar">Limpar todos os dados</button>
  </section>
</main>

<nav>
  <button class="nav-btn active" data-tab="bipar">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="2" height="16"/><rect x="7" y="4" width="4" height="16"/><rect x="13" y="4" width="2" height="16"/><rect x="17" y="4" width="4" height="16"/></svg>
    Bipar
  </button>
  <button class="nav-btn" data-tab="consultar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="10" r="6"/><line x1="21" y1="21" x2="14.5" y2="14.5"/></svg>
    Consultar
  </button>
  <button class="nav-btn" data-tab="exportar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="3" x2="12" y2="14"/><polyline points="6 9 12 15 18 9"/><line x1="4" y1="20" x2="20" y2="20"/></svg>
    Exportar
  </button>
  <button class="nav-btn" data-tab="config">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><circle cx="14" cy="7" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="8" cy="12" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="16" cy="17" r="2" fill="currentColor" stroke="none"/></svg>
    Config
  </button>
</nav>

<div class="flash-overlay" id="flashOverlay"></div>

<script>
// ---------- storage ----------
function loadRegistros(){ try{ return JSON.parse(localStorage.getItem('ranRegistros')||'[]'); }catch(e){ return []; } }
function saveRegistros(arr){ localStorage.setItem('ranRegistros', JSON.stringify(arr)); }
function loadConfig(){ try{ return JSON.parse(localStorage.getItem('ranConfig')||'{}'); }catch(e){ return {}; } }
function saveConfig(cfg){ localStorage.setItem('ranConfig', JSON.stringify(cfg)); }

function uid(){ return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7); }

function addRegistro(ran, endereco, tipo){
  const cfg = loadConfig();
  const arr = loadRegistros();
  arr.push({
    id: uid(),
    ran: ran,
    endereco: endereco,
    tipo: tipo,
    operador: cfg.operador || '',
    timestamp: new Date().toISOString(),
    sincronizado: false
  });
  saveRegistros(arr);
}

function getEstadoAtual(){
  const arr = loadRegistros();
  const map = new Map();
  arr.slice().sort((a,b)=> a.timestamp.localeCompare(b.timestamp)).forEach(r=> map.set(r.ran, r));
  return Array.from(map.values()).sort((a,b)=> b.timestamp.localeCompare(a.timestamp));
}

// ---------- state ----------
let currentMode = 'estoque';   // 'estoque' | 'linha'
let scanState = 'ran';         // 'ran' | 'endereco'
let tempRan = null;
let currentTab = 'bipar';

const el = id => document.getElementById(id);

// ---------- mode toggle ----------
function setMode(mode){
  currentMode = mode;
  el('modeEstoqueBtn').classList.toggle('active-estoque', mode==='estoque');
  el('modeLinhaBtn').classList.toggle('active-linha', mode==='linha');
  el('scanInput').classList.toggle('mode-estoque', mode==='estoque');
  el('scanInput').classList.toggle('mode-linha', mode==='linha');
}
el('modeEstoqueBtn').onclick = ()=> setMode('estoque');
el('modeLinhaBtn').onclick = ()=> setMode('linha');

// ---------- scan flow ----------
function resetScanState(save){
  scanState = 'ran';
  tempRan = null;
  el('scanPreview').innerHTML = '';
  el('scanStepLabel').textContent = 'Bipe a peça (RAN)';
  el('scanInput').value = '';
  el('cancelBtn').style.display = 'none';
  focusScanInput();
}

function focusScanInput(){
  if(currentTab==='bipar'){
    setTimeout(()=> el('scanInput').focus(), 30);
  }
}

function handleConfirm(){
  const val = el('scanInput').value.trim().toUpperCase();
  if(!val) return;

  if(scanState==='ran'){
    tempRan = val;
    el('scanPreview').innerHTML = 'Peça: <b>'+tempRan+'</b>';
    el('scanStepLabel').textContent = 'Bipe o endereço';
    el('scanInput').value = '';
    el('cancelBtn').style.display = 'block';
    scanState = 'endereco';
    focusScanInput();
  } else {
    addRegistro(tempRan, val, currentMode);
    showFlash(tempRan + ' → ' + val);
    el('lastSaved').textContent = 'Último: ' + tempRan + ' → ' + val + ' (' + (currentMode==='estoque'?'estoque':'linha') + ')';
    resetScanState();
  }
}

el('confirmBtn').onclick = handleConfirm;
el('cancelBtn').onclick = ()=> resetScanState();

el('scanInput').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); handleConfirm(); }
});
el('scanInput').addEventListener('input', e=>{
  e.target.value = e.target.value.toUpperCase();
  if(scanState==='ran' && e.target.value.length>=7){
    setTimeout(handleConfirm, 60);
  }
});

function showFlash(msg){
  const f = el('flashOverlay');
  f.textContent = '✓ Salvo: ' + msg;
  f.classList.add('show');
  setTimeout(()=> f.classList.remove('show'), 500);
}

// keep scanner focused on the input while on the "bipar" tab
document.addEventListener('click', ()=>{
  if(currentTab==='bipar') focusScanInput();
});

// ---------- consultar ----------
function renderConsulta(filter){
  filter = (filter||'').trim().toUpperCase();
  const estado = getEstadoAtual().filter(r=>{
    if(!filter) return true;
    return r.ran.includes(filter) || r.endereco.toUpperCase().includes(filter);
  });
  const wrap = el('consultaWrap');
  if(estado.length===0){
    wrap.innerHTML = '<div class="empty-state">Nenhum registro ainda. Comece bipando na aba Bipar.</div>';
    return;
  }
  let html = '<table><thead><tr><th>RAN</th><th>Endereço</th><th>Tipo</th><th>Quando</th></tr></thead><tbody>';
  estado.forEach(r=>{
    const d = new Date(r.timestamp);
    const quando = d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    html += '<tr><td class="mono">'+r.ran+'</td><td class="mono">'+r.endereco+'</td>'+
            '<td><span class="badge '+r.tipo+'">'+(r.tipo==='estoque'?'Estoque':'Linha')+'</span></td>'+
            '<td>'+quando+'</td></tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}
el('searchInput').addEventListener('input', e=> renderConsulta(e.target.value));

// ---------- exportar ----------
function toCSV(rows, headers, keys){
  const lines = [headers.join(';')];
  rows.forEach(r=> lines.push(keys.map(k=> String(r[k]??'').replace(/;/g,',')).join(';')));
  return lines.join('\n');
}
function downloadCSV(content, filename){
  const blob = new Blob(['\uFEFF'+content], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function dateTag(){ return new Date().toISOString().slice(0,10); }

function renderExportarStats(){
  const estado = getEstadoAtual();
  el('statEstoque').textContent = estado.filter(r=>r.tipo==='estoque').length;
  el('statLinha').textContent = loadRegistros().filter(r=>r.tipo==='linha' && !r.sincronizado).length;
}

el('btnExpEstoque').onclick = ()=>{
  const rows = getEstadoAtual().filter(r=>r.tipo==='estoque').map(r=>({
    ran:r.ran, endereco:r.endereco, quando:new Date(r.timestamp).toLocaleString('pt-BR')
  }));
  if(rows.length===0){ alert('Nenhuma peça em estoque registrada ainda.'); return; }
  downloadCSV(toCSV(rows, ['RAN','Endereço','Atualizado em'], ['ran','endereco','quando']), 'estoque-atual-'+dateTag()+'.csv');
};

el('btnExpLinha').onclick = ()=>{
  const all = loadRegistros();
  const pendentes = all.filter(r=>r.tipo==='linha' && !r.sincronizado);
  if(pendentes.length===0){ alert('Nenhuma movimentação pendente pra linha.'); return; }
  const rows = pendentes.map(r=>({ran:r.ran, endereco:r.endereco, quando:new Date(r.timestamp).toLocaleString('pt-BR'), operador:r.operador}));
  downloadCSV(toCSV(rows, ['RAN','Endereço','Data/Hora','Operador'], ['ran','endereco','quando','operador']), 'linha-pendente-'+dateTag()+'.csv');
  if(confirm('Marcar esses '+pendentes.length+' registros como sincronizados com o SAP?')){
    const ids = new Set(pendentes.map(r=>r.id));
    const updated = all.map(r=> ids.has(r.id) ? {...r, sincronizado:true} : r);
    saveRegistros(updated);
    renderExportarStats();
  }
};

el('btnExpHistorico').onclick = ()=>{
  const all = loadRegistros();
  if(all.length===0){ alert('Ainda não há registros.'); return; }
  const rows = all.map(r=>({ran:r.ran, endereco:r.endereco, tipo:r.tipo, quando:new Date(r.timestamp).toLocaleString('pt-BR'), operador:r.operador, sincronizado:r.sincronizado?'sim':'não'}));
  downloadCSV(toCSV(rows, ['RAN','Endereço','Tipo','Data/Hora','Operador','Sincronizado'], ['ran','endereco','tipo','quando','operador','sincronizado']), 'historico-completo-'+dateTag()+'.csv');
};

// ---------- config ----------
function renderConfig(){
  const cfg = loadConfig();
  el('cfgSetor').value = cfg.setor || '';
  el('cfgOperador').value = cfg.operador || '';
  el('statTotal').textContent = loadRegistros().length;
}
el('btnSalvarCfg').onclick = ()=>{
  const cfg = { setor: el('cfgSetor').value.trim(), operador: el('cfgOperador').value.trim() };
  saveConfig(cfg);
  el('setorLabel').textContent = cfg.setor || 'Setor não definido';
  alert('Configuração salva.');
};
el('btnLimpar').onclick = ()=>{
  if(confirm('Isso vai apagar TODOS os registros salvos neste dispositivo. Tem certeza?')){
    localStorage.removeItem('ranRegistros');
    location.reload();
  }
};

// ---------- tabs ----------
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    el('tab-'+currentTab).classList.add('active');
    if(currentTab==='consultar') renderConsulta(el('searchInput').value);
    if(currentTab==='exportar') renderExportarStats();
    if(currentTab==='config') renderConfig();
    if(currentTab==='bipar') focusScanInput();
  };
});

// ---------- init ----------
(function init(){
  const cfg = loadConfig();
  el('setorLabel').textContent = cfg.setor || 'Setor não definido';
  setMode('estoque');
  resetScanState();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
